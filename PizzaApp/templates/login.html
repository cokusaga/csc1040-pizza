{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <h2 class="text-center">Login</h2>

    <!-- Grey Box Section -->
    <div class="card p-4 shadow-sm text-center" style="width: 100%; max-width: 600px; background-color: rgb(36, 36, 36); border-radius: 10px; margin: 0 auto;">
        <!-- Content inside the grey box -->
        <div class="form-container">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-warning btn-lg w-100">Login</button>
            </form>
            <p class="mt-3 text-center">Don't have an account? <a href="{% url 'register' %}">Sign up here</a></p>
        </div>
    </div>
</div>
{% endblock %}
